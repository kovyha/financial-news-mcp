name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  protected-files:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Block protected file changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'protected-change-approved') }}
        run: |
          # Read the list from the base branch, so a PR can't shorten its own check.
          # (Falls back to the PR's copy only until the list first lands on main.)
          git show "$BASE_SHA:.github/protected-files.txt" > /tmp/protected 2>/dev/null \
            || cp .github/protected-files.txt /tmp/protected
          changed=$(git diff --name-only "$BASE_SHA"...HEAD | grep -E -f /tmp/protected || true)
          if [ -z "$changed" ]; then
            echo "✅ No protected files modified."
            exit 0
          fi
          echo "Protected files modified:"
          echo "$changed"
          if [ "$APPROVED" = "true" ]; then
            echo "✅ Approved by a maintainer via the 'protected-change-approved' label."
            exit 0
          fi
          echo ""
          echo "❌ Protected files need a maintainer to review the change and add the"
          echo "'protected-change-approved' label to this PR. See CONTRIBUTING.md."
          exit 1

  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-${{ runner.os }}-${{ hashFiles('financial_news/approved_models.py') }}

      - name: Pre-download approved finBERT model at its pinned revision
        run: uv run python -m financial_news.sandbox prefetch-model

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest --cov=financial_news --cov-report=term-missing -q

  eval-fingerprint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      needs_eval: ${{ steps.fingerprint.outputs.needs_eval }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --group diagnostic

      - name: Compare the evaluation fingerprint with the base branch
        id: fingerprint
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "$BASE_SHA:eval/fingerprint.json" > /tmp/base-fingerprint.json 2>/dev/null \
            || rm -f /tmp/base-fingerprint.json
          git show "$BASE_SHA:eval/baseline3_reasoning.json" > /tmp/base-verdicts.json
          uv run python -m financial_news.eval_gate fingerprint-check \
            --base /tmp/base-fingerprint.json --base-verdicts /tmp/base-verdicts.json

  eval-run:
    needs: eval-fingerprint
    if: needs.eval-fingerprint.outputs.needs_eval == 'true'
    runs-on: ubuntu-latest
    # Waits for a maintainer to approve: the run spends Anthropic API credit.
    environment: evaluation

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch the private candidate pool
        uses: actions/checkout@v4
        with:
          repository: kovyha/financial-news-eval-data
          token: ${{ secrets.EVAL_DATA_TOKEN }}
          path: eval-data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-${{ runner.os }}-${{ hashFiles('financial_news/approved_models.py') }}

      - name: Pre-download approved finBERT model at its pinned revision
        run: uv run python -m financial_news.sandbox prefetch-model

      - name: Re-run the judge and compare with the base branch
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          cp eval-data/candidates.json eval/candidates.json
          git show "$BASE_SHA:eval/baseline3_reasoning.json" > /tmp/base-verdicts.json
          uv run python -m financial_news.eval_gate check --base-verdicts /tmp/base-verdicts.json

  sandbox:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up sandbox runtime
        uses: ./.github/actions/setup-sandbox

      - name: Install dependencies
        run: uv sync

      - name: Try every escape route from inside the sandbox
        env:
          RUN_SANDBOX_TESTS: "1"
        run: uv run pytest tests/test_sandbox_integration.py -v --no-cov
