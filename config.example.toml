# financial-news-mcp configuration
#
# Copy this file to config.toml and adjust values as needed.
# config.toml is gitignored — do not commit it.
#
# FINNHUB_API_KEY is not configured here — keep secrets in the environment.
# Example: export FINNHUB_API_KEY='your_key'

[logging]

# Directory where log files are written (relative to working directory).
log_dir = "logs"

# Maximum size of each log file in bytes before it is rolled and compressed.
# Default: 10485760 (10 MB)
max_bytes = 10485760

# Base name for log files.
# Produces <filename>.log (all levels) and <filename>.error.log (errors only).
filename = "financial_news"

# Log level: INFO (normal operation) or DEBUG (verbose, for development).
# INFO  — logs tool invocations, computed statistics, and errors.
# DEBUG — additionally logs raw fetch requests, article counts, and headlines
#         passed to the model.
level = "INFO"

[analysis]

# Cap applied to infinite z-scores (zero-baseline spikes) before exporting to
# Grafana Cloud and before passing values to LLM prompts. Must be > 0.
# Default: 99.0
z_score_cap = 99.0

# How many days back to surface headline context for elevated/unusual tickers.
# Must be <= baseline_days. Controls the narrative window passed to Claude in
# both interactive (MCP) and briefing modes — no extra API call is made.
# Default: 7
# headline_days = 7

# Winsorization multiplier applied to the 30-day baseline before computing the
# EWM mean/std. Baseline days above median + winsorize_k * MAD are capped to
# that value, so a single old spike day (e.g. stale earnings/M&A headlines)
# can't inflate the baseline std and mask a genuinely unusual day. One-sided
# (upper tail only) since article counts floor at 0. Must be > 0.
# Default of 5.19 (= 3.5 / 0.6745) is equivalent to the Iglewicz & Hoaglin
# modified z-score outlier threshold (|M| > 3.5), expressed in raw MAD units
# rather than 0.6745-scaled units.
# Default: 5.19
# winsorize_k = 5.19

[price]

# How many trading days back to build the return-volatility baseline for the
# get_price_move signal. Must be > 0.
# Default: 30
# baseline_days = 30

# Z-score thresholds classifying today's price move as normal / elevated /
# unusual, applied to the absolute value of the z-score (a large move in
# either direction is anomalous). threshold_elevated must be < threshold_unusual.
# Defaults: 2.0 / 3.0
# threshold_elevated = 2.0
# threshold_unusual = 3.0

# Cap applied to the price z-score's magnitude before exporting to Grafana
# Cloud. Must be > 0.
# Default: 99.0
# z_score_cap = 99.0

# Winsorization multiplier applied to the baseline daily returns before
# computing the EWM mean/std. Unlike [analysis] winsorize_k (upper tail only),
# this caps both tails — a single extreme historical move (crash or spike)
# in either direction can't inflate the baseline std. Must be > 0.
# Default: 5.19 (same derivation as [analysis] winsorize_k)
# winsorize_k = 5.19

# Delay (in seconds) between consecutive per-ticker yfinance calls in the
# monitor's watchlist loop. Unlike Finnhub (a documented, generous per-minute
# quota), yfinance is an unofficial scraper of Yahoo's internal endpoints that
# is known to rate-limit or temporarily block IPs making rapid back-to-back
# requests. Must be >= 0; 0 disables the delay.
# Default: 1.0
# fetch_delay_seconds = 1.0

# Bar size for get_price_intraday's today-only drill-down bars (a same-day
# attribution aid, not part of the daily anomaly signal above). Passed straight
# through to yfinance's `interval` argument — not validated against a whitelist
# here, since yfinance's supported values aren't owned by this project. An
# invalid value surfaces as a clear error from price.py at fetch time instead.
# Default: "5m"
# intraday_interval = "5m"

[monitor]

# Tickers to watch during the daily monitoring run.
# Remove or add symbols as needed — each must be a valid Finnhub symbol.
tickers = ["NVDA", "TSLA", "META", "AMD", "F", "BAC", "GME", "PLUG", "XOM", "UNH", "SPCX"]

# Path where the monitor writes its stats snapshot after each run.
# The briefing agent reads this file (if fresh) instead of re-fetching from Finnhub.
# Default: /tmp/financial_news_snapshot.json
# snapshot_path = "/tmp/financial_news_snapshot.json"

[briefing]

# Maximum number of headlines to pass to Claude per ticker lookup.
# Default: 50
max_headlines = 50

# Minimum finBERT confidence score (0–1) for a headline to be included in the
# LLM prompt. Headlines below this threshold are excluded unless fewer than
# prompt_headlines_min would remain, in which case the top-scoring headlines
# fill the gap up to the minimum. Default: 0.85
# confidence_threshold = 0.85

# Minimum and maximum number of headlines passed to the LLM prompt per ticker.
# The min ensures the LLM always has some context even when scores are low;
# the max prevents token bloat on high-volume tickers.
# Defaults: min=5, max=50
# prompt_headlines_min = 5
# prompt_headlines_max = 50

[sentiment]

# HuggingFace model used for finBERT headline sentiment scoring.
# Requires the `sentiment` dependency group: uv sync --group sentiment
# Alternatives: "ahmedrachid/FinancialBERT-Sentiment-Analysis"
# Default: "ProsusAI/finbert"
# model_name = "ProsusAI/finbert"

# Expected classification labels produced by the model (lowercased).
# Must match the model's output class names exactly; unexpected labels are
# replaced with "unavailable" and logged as a warning.
# Default matches ProsusAI/finbert.
# labels = ["positive", "negative", "neutral"]

# [email]
# Send a summary email after each monitor run. Remove the comment markers to
# enable. Credentials come from environment variables (not stored here):
#   SMTP_USER     — login username, usually the sender address
#   SMTP_PASSWORD — login password or app password
#
# recipients = ["you@example.com", "teammate@example.com"]
# smtp_host   = "smtp.gmail.com"
# smtp_port   = 587          # default; TLS STARTTLS
# smtp_from   = ""           # optional override; defaults to SMTP_USER
